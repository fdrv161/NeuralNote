name: Build (Windows x64)

on:
  push:
    branches: [a11y]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The soundfont is downloaded and built at configure time (~55 MB of sources).
      # It only depends on the fetch script, so it is safe to cache.
      - name: Cache soundfont
        uses: actions/cache@v4
        with:
          path: NeuralNote/Assets/SoundFont/NeuralNote_GM.sf3
          key: soundfont-${{ hashFiles('Tools/fetch_soundfont.py', 'Tools/make_soundfont.py') }}

      # The README says only Clang has been tested, so build with clang-cl
      # (ships with Visual Studio 2022 on the runner). CPU-only build: no Vulkan SDK.
      # LTO is off to keep the build simpler and faster for testing.
      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL
          -DLTO=OFF
          -DMUSCRIPTOR_VULKAN=OFF
          -DPython3_EXECUTABLE="${{ env.pythonLocation }}\python.exe"

      - name: Build Standalone and VST3
        run: cmake --build build --config Release --target NeuralNote_Standalone NeuralNote_VST3 --parallel

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: NeuralNote-Standalone-Windows-x64
          path: build/NeuralNote_artefacts/Release/Standalone/
          retention-days: 7
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: NeuralNote-VST3-Windows-x64
          path: build/NeuralNote_artefacts/Release/VST3/
          retention-days: 7
          if-no-files-found: error
